<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Songdo Edge Console</title>
<style>
 body{font-family:system-ui,sans-serif;margin:2rem;max-width:900px}
 .badge{padding:.2rem .6rem;border-radius:.4rem;color:#fff;font-weight:600}
 .on{background:#2e7d32}.off{background:#c62828}
 table{border-collapse:collapse;width:100%;margin-top:1rem}
 td,th{border:1px solid #ccc;padding:.3rem .6rem;text-align:left}
 button{margin-right:.5rem;padding:.4rem .8rem}
</style></head><body>
<h1>Songdo Edge Console</h1>
<p>Node: <b id="node">-</b> &nbsp; <span id="wan" class="badge">-</span></p>
<p><button onclick="post('cut')">Simulate WAN Internet Cut</button>
   <button onclick="post('restore')">Restore WAN Connection</button></p>
<p>Events: <b id="ev">0</b> | Decisions: <b id="dec">0</b> | Outbox queued: <b id="ob">0</b> | Delivered: <b id="sink">0</b> | Conserved: <b id="cons">-</b></p>
<table><thead><tr><th>Process</th><th>PID</th><th>State</th><th>CPU %</th><th>RSS (kB)</th><th>Ctx vol</th><th>Ctx invol</th><th>Restarts</th></tr></thead>
<tbody id="rows"></tbody></table>
<script>
async function post(a){await fetch('/api/wan/'+a,{method:'POST'});refresh();}
async function refresh(){
 try{const s=await (await fetch('/api/status')).json();
  node.textContent=s.node;
  wan.textContent=s.wan_online?'WAN: ONLINE':'WAN: OFFLINE (DISCONNECTED)';
  wan.className='badge '+(s.wan_online?'on':'off');
  ev.textContent=s.counts.events;dec.textContent=s.counts.decisions;
  ob.textContent=s.outbox_pending;sink.textContent=s.counts.sink;
  cons.textContent=s.conservation.conserved?'yes':'NO';
  rows.innerHTML=s.processes.map(p=>`<tr><td>${p.name}</td><td>${p.pid}</td><td>${p.state}</td><td>${p.cpu_pct}</td><td>${p.rss_kb}</td><td>${p.ctx_voluntary}</td><td>${p.ctx_involuntary}</td><td>${p.restarts}</td></tr>`).join('');
 }catch(e){wan.textContent='API unreachable';wan.className='badge off';}
}
refresh();setInterval(refresh,1000);
</script></body></html>
