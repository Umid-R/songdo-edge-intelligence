<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Songdo Edge - Live map</title>
<!-- Zero-dependency page: no map tiles, fonts or scripts from the Internet, so it keeps working
     while the WAN is cut (that is the demo). Data: GET /api/map/context once, GET /api/map every second.
     One scene per theme, chosen by the node's config (map.scene):
       os1_building (OS1-5) · os2_park (OS2-5) · os3_intersection (OS3-5) · os5_sluice (OS5-5) -->
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d232b;--mute:#66707c;--line:#dfe3e8;--ok:#1f7a3a;--okbg:#e5f4ea;
 --bad:#b3261e;--badbg:#fbe9e7;--run:#1d5fb4;--runbg:#e6effb;--warn:#8a5a00;--warnbg:#fdf3dc}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem;padding:.8rem 1.4rem;background:#14202e;color:#fff}
header h1{font-size:1.05rem;margin:0 1rem 0 0;font-weight:650}
header .node{color:#b9c6d6;font-family:ui-monospace,monospace;font-size:.85rem}
header .sp{flex:1}
header a,header button{font:inherit;background:#22334a;border:1px solid #34495f;color:#fff;padding:.32rem .75rem;
 border-radius:6px;cursor:pointer;text-decoration:none}
header a:hover,header button:hover{border-color:#6d8299}
button.act{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);padding:.32rem .7rem;border-radius:6px;cursor:pointer}
button.act:hover{border-color:#9aa5b1}button.act.danger{border-color:#e3b2ad;color:var(--bad)}
.badge{display:inline-block;padding:.12rem .55rem;border-radius:999px;font-size:.78rem;font-weight:650;white-space:nowrap}
.on{background:var(--okbg);color:var(--ok)}.off{background:var(--badbg);color:var(--bad)}
.none{background:#eef0f3;color:var(--mute)}.run{background:var(--runbg);color:var(--run)}.warnb{background:var(--warnbg);color:var(--warn)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:1rem;padding:1rem 1.4rem;align-items:start}
@media(max-width:1150px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.75rem .95rem;margin-bottom:.9rem}
.card h2{font-size:.9rem;margin:0 0 .55rem;display:flex;align-items:center;gap:.5rem}
.card h2 .sp{flex:1}
.mapcard{padding:0;overflow:hidden;position:relative}
svg#map{display:block;width:100%;height:auto;background:#dfe5dc}
.mute{color:var(--mute)}.small{font-size:.8rem}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem}
.big{font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.row{display:flex;align-items:baseline;gap:.6rem}
.bar{height:6px;background:#e8ebef;border-radius:3px;overflow:hidden;margin:.35rem 0}
.bar i{display:block;height:100%;background:#e8a400}
table{border-collapse:collapse;width:100%;font-size:.78rem}
td .badge{font-size:.68rem;padding:.08rem .4rem}
td,th{padding:.25rem .3rem;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mute);font-weight:600;font-size:.72rem;text-transform:uppercase}
tr.warnrow td{background:#fdf6e3}
.chips{display:flex;flex-wrap:wrap;gap:.25rem;margin:.2rem 0 .5rem}
.chip{font-size:.72rem;padding:.05rem .4rem;border-radius:4px;background:#eef2f6;border:1px solid #dde3ea}
.stop{padding:.35rem .4rem;border-radius:6px;cursor:default}.stop.hl{background:#fff6d6}
.legend{display:flex;flex-wrap:wrap;gap:.4rem 1rem;padding:.55rem .9rem;border-top:1px solid var(--line);font-size:.78rem;color:var(--mute)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:.3rem;vertical-align:-1px}
.sf{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.4rem;text-align:center}
.sf .box{border:1px solid var(--line);border-radius:8px;padding:.45rem .3rem}
.sf .link{font-size:.75rem;font-weight:650;min-width:84px}
.btns{display:flex;flex-wrap:wrap;gap:.4rem;margin:.4rem 0}
ol.steps{margin:.3rem 0 0;padding-left:1.2rem;font-size:.8rem;color:var(--mute)}
#err{display:none;position:absolute;inset:0;background:rgba(20,32,46,.72);color:#fff;font-weight:650;
 align-items:center;justify-content:center;text-align:center;padding:2rem;font-size:1.05rem}
</style></head><body>
<header>
 <h1 id="title">Songdo Edge · Live map</h1><span class="node" id="node">-</span>
 <span id="wan" class="badge none">WAN -</span><span id="recv" class="badge none">receiver -</span>
 <span class="sp"></span>
 <button onclick="wan('cut')">Simulate WAN Internet Cut</button>
 <button onclick="wan('restore')">Restore WAN Connection</button>
 <a href="/">Console</a>
</header>
<div class="wrap">
 <div>
  <div class="card mapcard">
   <svg id="map" viewBox="0 0 1000 640" role="img" aria-label="Live schematic map of the edge node's site"></svg>
   <div id="err"></div>
   <div class="legend" id="legend"></div>
  </div>
  <p class="small mute" id="foot" style="margin:.2rem .2rem 0"></p>
 </div>
 <aside>
  <div class="card" id="extraTop" style="display:none"></div>
  <div class="card">
   <h2><span id="actTitle">Actuator</span><span class="sp"></span><span id="actBadge" class="badge none">-</span></h2>
   <div class="row"><span class="big" id="actVal">-</span><span class="mute" id="actUnit"></span></div>
   <div class="bar"><i id="ttlBar" style="width:0"></i></div>
   <div class="small" id="actTxt">-</div>
  </div>
  <div class="card">
   <h2>Sensors (node readings)</h2>
   <div id="sensors"></div>
  </div>
  <div class="card">
   <h2>Store and forward<span class="sp"></span><span id="consBadge" class="badge none">-</span></h2>
   <div class="sf">
    <div class="box"><div class="small mute">Edge node</div><div class="big" id="evN" style="font-size:1.2rem">-</div><div class="small mute">events stored</div></div>
    <div class="link" id="linkTxt">-</div>
    <div class="box"><div class="small mute">Receiver</div><div class="big" id="dlN" style="font-size:1.2rem">-</div><div class="small mute">delivered</div></div>
   </div>
   <div class="row" style="margin-top:.55rem"><span class="mute small">Outbox waiting</span><span class="big" id="obN" style="font-size:1.2rem">-</span></div>
  </div>
  <div class="card">
   <h2>Latest decisions<span class="sp"></span><span class="small mute" id="decCounts"></span></h2>
   <table><thead><tr><th>Time</th><th>Rule</th><th>Value</th><th>Status</th></tr></thead><tbody id="dec"></tbody></table>
  </div>
  <div class="card">
   <h2>Node processes</h2>
   <table><thead><tr><th>Process</th><th>PID</th><th>Restarts</th><th>State</th></tr></thead><tbody id="procs"></tbody></table>
  </div>
  <div class="card" id="extra" style="display:none"></div>
 </aside>
</div>
<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
const $ = id => document.getElementById(id);
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e);
  return e;
}
function txt(s, attrs, parent) { const t = el("text", attrs, parent); t.textContent = s; return t; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtTime(t) { return new Date(t * 1000).toLocaleTimeString([], {hour12: false}); }
function last(series) { return series && series.length ? series[series.length - 1].v : null; }
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

// Shared state. S.ctx: /api/map/context; S.live: last /api/map answer; S.ok: node answered.
const S = {ctx: null, live: null, ok: false};
const L = {};          // SVG elements shared by the common parts (node LEDs, banner)
const SCENES = {};
let SC = null;         // active scene

// Edge-node cabinet with node + WAN LEDs (every scene draws one).
function nodeBox(x, y, sub, parent) {
  const g = el("g", {}, parent);
  el("rect", {x: x - 52, y, width: 104, height: 36, rx: 5, fill: "#14202e"}, g);
  txt("EDGE NODE", {x: x - 6, y: y + 15, "font-size": 10, "font-weight": 700, fill: "#fff", "text-anchor": "middle"}, g);
  txt(sub, {x: x - 6, y: y + 28, "font-size": 8.5, fill: "#b9c6d6", "text-anchor": "middle"}, g);
  L.nodeLed = el("circle", {cx: x + 42, cy: y + 10, r: 4, fill: "#9aa5b1"}, g);
  L.wanLed = el("circle", {cx: x + 42, cy: y + 24, r: 4, fill: "#9aa5b1"}, g);
  txt("node", {x: x + 55, y: y + 13, "font-size": 8, fill: "#4a5059"}, g);
  txt("WAN", {x: x + 55, y: y + 27, "font-size": 8, fill: "#4a5059"}, g);
  return g;
}
function drawBanner() {
  L.banner = el("g", {opacity: 0});
  L.bannerRect = el("rect", {x: 0, y: 0, width: 1000, height: 34, fill: "#b3261e"}, L.banner);
  L.bannerTxt = txt("", {x: 500, y: 22, "font-size": 14, "font-weight": 700, fill: "#fff", "text-anchor": "middle"}, L.banner);
}
function schematicNote(s) { txt(s || "Schematic layout, not to scale", {x: 990, y: 630, "font-size": 10, fill: "#6b7380", "text-anchor": "end"}); }
function ruleFor(actuator) { return S.ctx.rules.find(r => r.actuator === actuator) || S.ctx.rules[0]; }
function actuator(live, name) { return live.actuators.find(a => a.actuator === name) || {}; }

// ===================================================================== OS3 · Techno-Park intersection
SCENES.os3_intersection = (() => {
  const SIGN = "VARIABLE_SPEED_SIGN_KMH";
  // Main road W-E: y 270..370 (2 lanes each way, right-hand traffic: eastbound below the centre line).
  // Cross street N-S: x 450..550. Monitored crosswalk on the west arm (x 415..445).
  const LANES = [
    {id: "EB1", grp: "EW", axis: "x", s0: -40, d: 1, fix: 332.5, len: 1080, stop: 450, rate: .33},
    {id: "EB2", grp: "EW", axis: "x", s0: -40, d: 1, fix: 357.5, len: 1080, stop: 450, rate: .25, bus: 800, stopIdx: 1},
    {id: "WB1", grp: "EW", axis: "x", s0: 1040, d: -1, fix: 282.5, len: 1080, stop: 450, rate: .25, bus: 280, stopIdx: 0},
    {id: "WB2", grp: "EW", axis: "x", s0: 1040, d: -1, fix: 307.5, len: 1080, stop: 450, rate: .33},
    {id: "SB1", grp: "NS", axis: "y", s0: -40, d: 1, fix: 462.5, len: 720, stop: 270, rate: .12},
    {id: "SB2", grp: "NS", axis: "y", s0: -40, d: 1, fix: 487.5, len: 720, stop: 270, rate: .16},
    {id: "NB1", grp: "NS", axis: "y", s0: 680, d: -1, fix: 512.5, len: 720, stop: 270, rate: .16},
    {id: "NB2", grp: "NS", axis: "y", s0: 680, d: -1, fix: 537.5, len: 720, stop: 270, rate: .12},
  ];
  // Signal plan (seconds): EW green 10, amber 2, all-red 2, NS green 8 (= pedestrian walk on the
  // west crosswalk, which crosses the EW road), amber 2, all-red 2.
  const CYCLE = 26;
  function phase(t) {
    const c = t % CYCLE;
    if (c < 10) return {EW: "G", NS: "R", walk: false};
    if (c < 12) return {EW: "Y", NS: "R", walk: false};
    if (c < 14) return {EW: "R", NS: "R", walk: false};
    if (c < 22) return {EW: "R", NS: "G", walk: c < 20};
    if (c < 24) return {EW: "R", NS: "Y", walk: false};
    return {EW: "R", NS: "R", walk: false};
  }
  const V = {radar: null, peds: null, limit: null, active: false, remaining: 0, threshold: null};
  const K = 2.4;               // px per second per km/h (drawing scale only)
  const A = 120, B = 260, GAP = 9;
  let vehicles = [], peds = [], busTimer = 6, busSide = 0, simT = 0;
  const PAL = ["#3d6fb6", "#4f7fc4", "#5a6f8c", "#7b8794", "#2f5d9a", "#8a9bb0"];
  const LIGHT = {G: "#2ecc71", Y: "#f2c94c", R: "#e74c3c"};
  const M = {};

  function draw(ctx) {
    el("rect", {x: 0, y: 0, width: 1000, height: 640, fill: "#dfe5dc"});
    const blocks = [[0, 0, 430, 250], [570, 0, 430, 250], [0, 390, 430, 250], [570, 390, 430, 250]];
    const bld = [[40, 40, 150, 90], [230, 60, 150, 140], [620, 50, 120, 150], [780, 40, 170, 110], [800, 170, 150, 50],
                 [40, 470, 120, 130], [200, 520, 190, 90], [620, 440, 160, 90], [820, 430, 140, 170], [620, 560, 160, 50]];
    blocks.forEach(b => el("rect", {x: b[0], y: b[1], width: b[2], height: b[3], fill: "#e6eae3"}));
    bld.forEach(b => el("rect", {x: b[0], y: b[1], width: b[2], height: b[3], rx: 6, fill: "#d3d9e0", stroke: "#bcc5cf"}));
    el("rect", {x: 0, y: 250, width: 1000, height: 140, fill: "#c9ced3"});
    el("rect", {x: 430, y: 0, width: 140, height: 640, fill: "#c9ced3"});
    el("rect", {x: 0, y: 270, width: 1000, height: 100, fill: "#4a5059"});
    el("rect", {x: 450, y: 0, width: 100, height: 640, fill: "#4a5059"});
    const dash = {stroke: "#e9edf1", "stroke-width": 1.5, "stroke-dasharray": "14 12"};
    for (const y of [295, 345]) { el("line", {x1: 0, y1: y, x2: 410, y2: y, ...dash}); el("line", {x1: 590, y1: y, x2: 1000, y2: y, ...dash}); }
    for (const x of [475, 525]) { el("line", {x1: x, y1: 0, x2: x, y2: 230, ...dash}); el("line", {x1: x, y1: 410, x2: x, y2: 640, ...dash}); }
    const yel = {stroke: "#f2c94c", "stroke-width": 1.4};
    for (const o of [-1.6, 1.6]) {
      el("line", {x1: 0, y1: 320 + o, x2: 410, y2: 320 + o, ...yel}); el("line", {x1: 590, y1: 320 + o, x2: 1000, y2: 320 + o, ...yel});
      el("line", {x1: 500 + o, y1: 0, x2: 500 + o, y2: 230, ...yel}); el("line", {x1: 500 + o, y1: 410, x2: 500 + o, y2: 640, ...yel});
    }
    const sl = {stroke: "#fff", "stroke-width": 3};
    el("line", {x1: 410, y1: 320, x2: 410, y2: 370, ...sl}); el("line", {x1: 590, y1: 270, x2: 590, y2: 320, ...sl});
    el("line", {x1: 450, y1: 230, x2: 500, y2: 230, ...sl}); el("line", {x1: 500, y1: 410, x2: 550, y2: 410, ...sl});
    function zebra(x, y, w, h, vertical) {
      const g = el("g", {});
      const n = vertical ? Math.floor(h / 10) : Math.floor(w / 10);
      for (let i = 0; i < n; i++)
        vertical ? el("rect", {x, y: y + i * 10 + 2, width: w, height: 6, fill: "#f4f6f8"}, g)
                 : el("rect", {x: x + i * 10 + 2, y, width: 6, height: h, fill: "#f4f6f8"}, g);
    }
    M.cwGlow = el("rect", {x: 411, y: 266, width: 38, height: 108, rx: 5, fill: "none", stroke: "#f08c00", "stroke-width": 4, opacity: 0});
    zebra(415, 270, 30, 100, true); zebra(555, 270, 30, 100, true);
    zebra(450, 235, 100, 30, false); zebra(450, 375, 100, 30, false);
    M.sig = {
      EW: [el("circle", {cx: 404, cy: 380, r: 6, stroke: "#222", "stroke-width": 2}), el("circle", {cx: 596, cy: 260, r: 6, stroke: "#222", "stroke-width": 2})],
      NS: [el("circle", {cx: 440, cy: 224, r: 6, stroke: "#222", "stroke-width": 2}), el("circle", {cx: 560, cy: 416, r: 6, stroke: "#222", "stroke-width": 2})],
    };
    M.walk = [el("rect", {x: 434, y: 236, width: 12, height: 12, rx: 2, stroke: "#222"}), el("rect", {x: 434, y: 392, width: 12, height: 12, rx: 2, stroke: "#222"})];

    // bus stops (positions schematic: the BIS CSV has no coordinates)
    M.stopEls = {};
    const stops = (ctx.bus_stops && ctx.bus_stops.stops) || [];
    const placed = [{idx: 0, x: 760, y: 258, label: "above"}, {idx: 1, x: 760, y: 382, label: "below"}];
    const side = stops.filter((s, i) => i > 1 && /IT/.test(s.stop_name)).slice(0, 2);
    side.forEach((s, i) => placed.push({stop: s, x: i ? 562 : 438, y: 110, label: i ? "right" : "left"}));
    placed.forEach(p => {
      const s = p.stop || stops[p.idx]; if (!s) return;
      const g = el("g", {style: "cursor:default"});
      el("rect", {x: p.x - 16, y: p.y - 6, width: 32, height: 12, rx: 3, fill: "#1a8f6a", stroke: "#0f5c44"}, g);
      txt("BUS", {x: p.x, y: p.y + 3.5, "font-size": 8, "font-weight": 700, fill: "#fff", "text-anchor": "middle"}, g);
      const lx = p.label === "left" ? p.x - 22 : p.label === "right" ? p.x + 22 : p.x;
      const ly = p.label === "above" ? p.y - 14 : p.label === "below" ? p.y + 24 : p.y + 4;
      const anchor = p.label === "left" ? "end" : p.label === "right" ? "start" : "middle";
      txt(`${s.stop_name} · ${s.routes.length} routes`, {x: lx, y: ly, "font-size": 11, "font-weight": 600, fill: "#163d31", "text-anchor": anchor}, g);
      const t = el("title", {}, g); t.textContent = `${s.stop_name} (${s.stop_id})\n${s.routes.map(r => r.route_number).join(", ")}`;
      g.addEventListener("mouseenter", () => hlStop(s.stop_id, true));
      g.addEventListener("mouseleave", () => hlStop(s.stop_id, false));
      M.stopEls[s.stop_id] = g;
    });

    // edge node + dotted local links (sensing and actuation never leave the node)
    const link = {stroke: "#5b6470", "stroke-width": 1.2, "stroke-dasharray": "3 4", fill: "none"};
    el("path", {d: "M300 440 L175 430", ...link});
    el("path", {d: "M300 440 L330 398", ...link});
    el("path", {d: "M300 440 Q380 420 392 392", ...link});
    nodeBox(300, 440, "OS3 · local rules");
    el("path", {d: "M330 392 L250 334 L250 370 Z", fill: "#2f80ed", opacity: .16});
    el("rect", {x: 324, y: 386, width: 14, height: 10, rx: 2, fill: "#2f80ed"});
    M.radarTxt = txt("radar -", {x: 344, y: 412, "font-size": 11, "font-weight": 700, fill: "#1d232b"});
    el("rect", {x: 386, y: 386, width: 12, height: 10, rx: 2, fill: "#7b4fbf"});
    M.camTxt = txt("", {x: 426, y: 245, "font-size": 11, "font-weight": 700, fill: "#9a4d00", "text-anchor": "end"});
    el("rect", {x: 172, y: 418, width: 6, height: 60, fill: "#6b7380"});
    M.signRing = el("circle", {cx: 175, cy: 418, r: 30, fill: "#fff", stroke: "#c62828", "stroke-width": 7});
    M.signNum = txt("-", {x: 175, y: 429, "font-size": 28, "font-weight": 800, fill: "#111", "text-anchor": "middle"});
    M.signLeds = [[-30, -30], [30, -30], [-30, 30], [30, 30]].map(([dx, dy]) => el("circle", {cx: 175 + dx, cy: 418 + dy, r: 5, fill: "#f2a900", opacity: 0}));
    M.signTxt = txt("", {x: 175, y: 498, "font-size": 11, "font-weight": 700, fill: "#9a4d00", "text-anchor": "middle"});
    txt("variable speed sign", {x: 175, y: 512, "font-size": 10, fill: "#4a5059", "text-anchor": "middle"});
    M.peds = el("g", {}); M.veh = el("g", {}); M.labels = el("g", {});
    schematicNote();
  }

  function hlStop(id, on) {
    const d = document.querySelector(`.stop[data-id="${id}"]`); if (d) d.classList.toggle("hl", on);
    const g = M.stopEls && M.stopEls[id]; if (g) g.setAttribute("opacity", on ? .7 : 1);
  }
  function spawn(lane, bus) {
    const q = vehicles.filter(v => v.lane === lane);
    const lst = q.reduce((m, v) => (m && m.pos < v.pos ? m : v), null);
    const len = bus ? 46 : 22;
    if (lst && lst.pos - lst.len < len + GAP + 4) return false;
    const stop = bus && S.ctx.bus_stops && S.ctx.bus_stops.stops[lane.stopIdx];
    const routes = stop ? stop.routes.map(r => r.route_number) : ["bus"];
    const v = {lane, pos: 0, v: 0, len, bus, f: .9 + Math.random() * .2, passed: false, dwell: 0, served: false,
               route: bus ? routes[Math.floor(Math.random() * routes.length)] : null};
    v.v = targetSpeed(v);
    v.g = el("g", {}, M.veh);
    if (bus) {
      el("rect", {x: -len / 2, y: -7, width: len, height: 14, rx: 3, fill: "#1a8f6a", stroke: "#0f5c44"}, v.g);
      el("rect", {x: -len / 2 + 4, y: -4, width: len - 10, height: 8, rx: 1.5, fill: "#bfe9da", opacity: .8}, v.g);
      v.lab = el("g", {}, M.labels);
      el("rect", {x: -16, y: -9, width: 32, height: 14, rx: 3, fill: "#0f5c44"}, v.lab);
      txt(v.route, {x: 0, y: 2, "font-size": 9, "font-weight": 700, fill: "#fff", "text-anchor": "middle"}, v.lab);
    } else {
      el("rect", {x: -len / 2, y: -5.5, width: len, height: 11, rx: 3, fill: PAL[Math.floor(Math.random() * PAL.length)]}, v.g);
      el("rect", {x: len / 2 - 8, y: -4, width: 4, height: 8, rx: 1, fill: "#d8e3f0"}, v.g);
    }
    vehicles.push(v);
    return true;
  }
  function targetSpeed(v) {
    const kmh = V.radar == null ? 40 : V.radar;

  function stepVehicles(dt, ph) {
    for (const lane of LANES) {
      const q = vehicles.filter(v => v.lane === lane).sort((a, b) => b.pos - a.pos);
      q.forEach((v, i) => {
        let lim = i ? q[i - 1].pos - q[i - 1].len - GAP : Infinity;

        if (mustStop(v, ph[lane.grp])) lim = Math.min(lim, lane.stop - 1);

    }
    vehicles = vehicles.filter(v => {
      if (v.pos - v.len > v.lane.len) { v.g.remove(); if (v.lab) v.lab.remove(); return false; }
      return true;
    });
    for (const v of vehicles) {
      const c = v.lane.s0 + v.lane.d * (v.pos - v.len / 2);
      const [x, y] = v.lane.axis === "x" ? [c, v.lane.fix] : [v.lane.fix, c];
      const rot = v.lane.axis === "x" ? (v.lane.d > 0 ? 0 : 180) : (v.lane.d > 0 ? 90 : -90);
      v.g.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot})`);
      if (v.lab) v.lab.setAttribute("transform", `translate(${x.toFixed(1)} ${(y + 2).toFixed(1)})`);   // route number on the bus
    }
  }
  function newPed(side) {
    const p = {x: 417 + Math.random() * 26, y: side ? 374 + Math.random() * 13 : 253 + Math.random() * 13, side,
               st: "wait", sp: 28 + Math.random() * 16, op: 0};
    p.c = el("circle", {cx: p.x, cy: p.y, r: 3.6, fill: "#f08c00", stroke: "#8a4b00", "stroke-width": .8, opacity: 0}, M.peds);
    peds.push(p);
  }
  function stepPeds(dt, ph) {
    const target = V.peds == null ? 0 : Math.max(0, Math.min(40, Math.round(V.peds)));
    const present = peds.filter(p => p.st !== "gone");
    if (present.length < target) newPed(Math.random() < .5 ? 0 : 1);
    else if (present.length > target) { const w = present.find(p => p.st === "wait"); if (w) w.st = "gone"; }
    for (const p of peds) {
      if (p.st === "wait" && ph.walk && Math.random() < 2.5 * dt) p.st = "cross";
      if (p.st === "cross") {
        const ty = p.side ? 258 : 382;
        p.y += Math.sign(ty - p.y) * p.sp * dt;
        if (Math.abs(ty - p.y) < 2) p.st = "gone";
      }
      p.op = p.st === "gone" ? p.op - 2 * dt : Math.min(1, p.op + 2 * dt);
      p.c.setAttribute("cx", p.x.toFixed(1)); p.c.setAttribute("cy", p.y.toFixed(1)); p.c.setAttribute("opacity", Math.max(0, p.op).toFixed(2));
    }
    peds = peds.filter(p => { if (p.st === "gone" && p.op <= 0) { p.c.remove(); return false; } return true; });
  }
  function frame(dt, now) {
    simT += dt;
    const ph = phase(simT);
    for (const g of ["EW", "NS"]) M.sig[g].forEach(c => c.setAttribute("fill", LIGHT[ph[g]]));
    M.walk.forEach(r => r.setAttribute("fill", ph.walk ? "#2ecc71" : "#e74c3c"));
    for (const lane of LANES) if (Math.random() < lane.rate * dt) spawn(lane, false);
    busTimer -= dt;
    if (busTimer <= 0) { if (spawn(LANES[busSide ? 1 : 2], true)) { busSide ^= 1; busTimer = 9 + Math.random() * 8; } }
    stepVehicles(dt, ph);
    stepPeds(dt, ph);
    const blink = Math.floor(now / 450) % 2 === 0;
    M.signLeds.forEach(c => c.setAttribute("opacity", V.active && blink ? 1 : 0));
    const surge = V.threshold != null && V.peds != null && V.peds > V.threshold;
    M.cwGlow.setAttribute("opacity", surge ? (.55 + .45 * Math.sin(now / 180)).toFixed(2) : 0);
  }
  function render(live) {
    const rule = ruleFor(SIGN);
    V.radar = last(live.readings.RADAR_SPEED);
    V.peds = last(live.readings.PED_CROSSWALK_COUNT);

    M.signTxt.textContent = V.active ? `surge rule · ${Math.ceil(V.remaining)} s left` : "";
    const over = V.radar != null && V.limit != null && V.radar > V.limit;
    M.radarTxt.textContent = V.radar == null ? "radar -" : `radar ${V.radar.toFixed(0)} km/h`;
    M.radarTxt.setAttribute("fill", over ? "#b3261e" : "#1d232b");
    const surge = V.peds != null && V.threshold != null && V.peds > V.threshold;
    M.camTxt.textContent = V.peds == null ? "" : surge ? `SURGE ${Math.round(V.peds)} people > ${V.threshold}` : `${Math.round(V.peds)} at crosswalk`;
    M.camTxt.setAttribute("fill", surge ? "#b3261e" : "#4a5059");
  }
  function extra(ctx) {
    const bs = ctx.bus_stops;
    if (!bs) return {title: "Bus stops", html: '<div class="small mute">No reference data configured.</div>'};
    return {title: "Bus stops (OS3-1 context)",
      html: `<div class="small mute">${esc(bs.source)} · reference date ${esc(bs.reference_date)}</div>` + bs.stops.map(s =>
        `<div class="stop" data-id="${esc(s.stop_id)}"><b>${esc(s.stop_name)}</b> <span class="mono mute">${esc(s.stop_id)}</span>
         <div class="chips">${s.routes.map(r => `<span class="chip" title="direction ${esc(r.direction)}">${esc(r.route_number)}</span>`).join("")}</div></div>`).join(""),
      init() {
        document.querySelectorAll(".stop").forEach(d => {
          d.addEventListener("mouseenter", () => hlStop(d.dataset.id, true));
          d.addEventListener("mouseleave", () => hlStop(d.dataset.id, false));
        });
      }};
  }
  return {
    title: "OS3-5 · Techno-Park intersection", nodeSub: "OS3", draw, frame, render, extra,
    offlineText: "the intersection runs on the edge node",
    act: {name: SIGN, title: "Variable speed sign", unit: "km/h", fmt: v => v == null ? "-" : Math.round(v),
          activeBadge: "command active", idleBadge: "default"},
    guide(name) {
      if (name === "RADAR_SPEED") return V.limit == null ? null : [V.limit, `limit ${V.limit}`];
      return undefined;
    },
    decimals: {RADAR_SPEED: 1, PED_CROSSWALK_COUNT: 0},
    legend: `<span><i style="background:#3d6fb6"></i>car (speed = latest radar reading)</span>
      <span><i style="background:#1a8f6a"></i>bus (illustrative, real route numbers)</span>
      <span><i style="background:#f08c00;border-radius:50%"></i>pedestrian (count = latest crosswalk reading)</span>
      <span><i style="background:#fff;border:2px solid #c62828;border-radius:50%"></i>variable speed sign (actuator state from the node)</span>`,
    foot: "Live data from this node: radar speed, crosswalk count, sign state and TTL, decisions, outbox and receiver counts. "
      + "Drawn by the page: car and pedestrian movement (from those readings), the signal plan and buses (illustrative; route numbers are real). "
      + "Bus stop names and routes are Incheon BIS data; their positions are schematic because the source CSV has no coordinates.",
  };
})();

// ===================================================================== OS2 · Central Park robot
SCENES.os2_park = (() => {
  const LATCH = "SAFETY_ESTOP_LATCH";

  const RELEASE = 1.0;        // m, release distance of the OS2-3 latch (hysteresis)
  const MIN_STOP_MS = 1200;   // keep a stop on screen long enough to see it
  const PX = 80;              // close-up scale: px per metre
  const RX = 690, RY = 235;   // robot position in the close-up

  const M = {};
  let pts = [], cum = [], total = 0, s = 0, dir = 1, reached = 0;
  let stopped = false, stopSince = 0, lastT = null, lidar = 3, lidarTarget = 3, scroll = 0, kind = "pedestrian";
  let markers = [];

  function project(ctx) {
    const f = ctx.path && ctx.path.features.find(x => x.geometry && x.geometry.type === "LineString");
    if (!f) return false;
    const c = f.geometry.coordinates;
    const lat0 = c.reduce((a, p) => a + p[1], 0) / c.length, lon0 = c.reduce((a, p) => a + p[0], 0) / c.length;
    const kx = Math.cos(lat0 * Math.PI / 180) * 111320, ky = 110540;

    const k = Math.min((BOX.w - 60) / w, (BOX.h - 90) / h);
    const ox = BOX.x + (BOX.w - w * k) / 2, oy = BOX.y + 30 + (BOX.h - 60 - h * k) / 2;
    pts = m.map(p => [ox + (p[0] - Math.min(...xs)) * k, oy + (Math.max(...ys) - p[1]) * k]);
    cum = [0];
    for (let i = 1; i < m.length; i++) cum.push(cum[i - 1] + Math.hypot(m[i][0] - m[i - 1][0], m[i][1] - m[i - 1][1]));
    total = cum[cum.length - 1];

    const a = pts[i - 1], b = pts[i];

  }

    const r = rng(2026), d = (x, y) => Math.min(...pts.map(p => Math.hypot(p[0] - x, p[1] - y)));
    for (let i = 0; i < 160; i++) {
      const x = BOX.x + 15 + r() * (BOX.w - 30), y = BOX.y + 40 + r() * (BOX.h - 55);

    M.markers = el("g", {});

    for (const m of [1, 2, 3]) {

    M.ring = el("circle", {cx: RX, cy: RY, r: .8 * PX, fill: "#e53935", "fill-opacity": .06, stroke: "#e53935", "stroke-width": 2}, g);
    el("circle", {cx: RX, cy: RY, r: RELEASE * PX, fill: "none", stroke: "#f08c00", "stroke-width": 1.5, "stroke-dasharray": "5 4"}, g);
    txt("0.8 m stop", {x: RX, y: RY - .8 * PX - 5, "font-size": 9.5, fill: "#c62828", "text-anchor": "middle"}, g);
    txt("1.0 m release", {x: RX, y: RY + RELEASE * PX + 12, "font-size": 9.5, fill: "#b25f00", "text-anchor": "middle"}, g);
    M.beam = el("line", {x1: RX, y1: RY, x2: RX, y2: RY, stroke: "#2f80ed", "stroke-width": 1.5, "stroke-dasharray": "2 3"}, g);

    M.cuRobot = el("g", {transform: `translate(${RX} ${RY})`}, g);
    el("rect", {x: -16, y: -12, width: 32, height: 24, rx: 6, fill: "#1d5fb4", stroke: "#0d3c7a"}, M.cuRobot);
    el("path", {d: "M10 -6 L18 0 L10 6 Z", fill: "#fff"}, M.cuRobot);
    M.lidarTxt = txt("LiDAR -", {x: CX + 14, y: CY + 52, "font-size": 12, "font-weight": 700, fill: "#1d232b"});

    nodeBox(CX + 80, PY + 150, "OS2 · on the robot");
    txt("Path: APPROXIMATE (SAMPLE) geometry", {x: 990, y: 630, "font-size": 10, fill: "#6b7380", "text-anchor": "end"});
  }
  function trigger(v, now) {
    if (!stopped) {

      const [x, y] = at(s);

      el("circle", {cx: x, cy: y, r: 5, fill: "#fff", stroke: "#e53935", "stroke-width": 2}, m);
      el("path", {d: `M${x - 2.5} ${y - 2.5} L${x + 2.5} ${y + 2.5} M${x + 2.5} ${y - 2.5} L${x - 2.5} ${y + 2.5}`, stroke: "#e53935", "stroke-width": 1.6}, m);

    M.beam.setAttribute("x2", hx.toFixed(1)); M.hit.setAttribute("cx", hx.toFixed(1));
    M.hit.setAttribute("fill", lidar < .8 ? "#e53935" : "#2f80ed");
    M.obst.setAttribute("opacity", stopped ? 1 : 0);
    M.obst.setAttribute("transform", `translate(${(hx + 8).toFixed(1)} ${RY})`);
    M.obstTxt.textContent = kind;
    M.ring.setAttribute("fill-opacity", stopped ? (.18 + .1 * Math.sin(now / 150)).toFixed(2) : .06);
    M.lidarTxt.textContent = `LiDAR nearest object ${lidar.toFixed(2)} m`;
    M.lidarTxt.setAttribute("fill", lidar < .8 ? "#c62828" : "#1d232b");
    M.state.textContent = stopped ? "E-STOP" : "DRIVING";
    M.state.setAttribute("fill", stopped ? "#c62828" : "#1f7a3a");
    M.stateSub.textContent = stopped ? `${kind} closer than 0.8 m; moves on when LiDAR reads ≥ ${RELEASE} m`
                                     : `${SPEED} m/s along the path${S.live && !S.live.wan_online ? " · no WAN needed" : ""}`;
    M.odo.textContent = `Driven ${Math.round(reached)} m of ${Math.round(total)} m`;
  }

    // concrete gate structure with an opening at the bottom

    M.gate = el("rect", {x: 552, y: 430, width: 36, height: 170, fill: "#d35400", stroke: "#8e3800", "stroke-width": 2});
    el("rect", {x: 528, y: 92, width: 84, height: 30, rx: 3, fill: "#596572"});
    txt("gate house", {x: 570, y: 111, "font-size": 10, fill: "#fff", "text-anchor": "middle"});

    txt(`flood threshold ${thr} m · rule: level > ${thr} → open gate`, {x: 530, y: Y(thr) - 6, "font-size": 11, "font-weight": 650, fill: "#c62828", "text-anchor": "end"});
    M.levelTxt = txt("-", {x: 300, y: Y(2) + 22, "font-size": 18, "font-weight": 800, fill: "#fff", "text-anchor": "middle"});

    M.mains = txt("mains -", {x: 860, y: 205, "font-size": 12, "font-weight": 700, fill: "#1d232b"});

  function flashMsg(msg, ms) { M.flashTxt.textContent = msg; flashUntil = performance.now() + (ms || 6000); }
  function render(live) {
    const v = last(live.readings.SLUICE_WATER_LEVEL_M);
    if (v != null) { levelTarget = v; if (level == null) level = v; }
    const volts = last(live.readings.MAINS_VOLT);

    const g = actuator(live, GATE);
    gateTarget = g.value >= 1 ? 1 : 0;
    M.gateTxt.textContent = g.value >= 1 ? `GATE OPEN · ${Math.ceil(g.remaining_s || 0)} s` : "GATE CLOSED";
    M.gateTxt.setAttribute("fill", g.value >= 1 ? "#d35400" : "#1d232b");
    const p = (live.processes || []).find(x => x.name === "Processor");

      if (procPid != null && p.pid !== procPid) flashMsg(`Processor restarted by the supervisor: PID ${procPid} → ${p.pid}`);

    let d = `M40 ${top.toFixed(1)}`;

    M.floodTxt.textContent = levelTarget > thr ? `FLOOD READING ${levelTarget.toFixed(2)} m > ${thr} m` : "";
    M.gate.setAttribute("y", (430 - gate * 140).toFixed(1));
    const h = 40 * flow;
    M.chan.setAttribute("y", (600 - h).toFixed(1)); M.chan.setAttribute("height", h.toFixed(1));
    M.flowG.setAttribute("opacity", flow > .1 ? flow.toFixed(2) : 0);
    M.flowG.setAttribute("transform", `translate(${((now / 25) % 45).toFixed(1)} 0)`);
    M.flash.setAttribute("opacity", now < flashUntil ? 1 : 0);
  }
  function extra(ctx) {
    if (!ctx.faults.includes("kill_processor")) return null;
    return {title: "Compound failure (OS5-5)", top: true,
      html: `<div class="small">Cut the WAN and kill the Processor at the same moment, during a flood. The supervisor
        restarts it, the gate still opens locally, and every flood event is delivered after the WAN returns.</div>
        <div class="btns"><button class="act danger" id="kWan">WAN cut + kill Processor</button>
        <button class="act" id="kOnly">Kill Processor only (SIGKILL)</button></div>
        <div class="small" id="faultMsg"></div>
        <ol class="steps"><li>Press <b>WAN cut + kill Processor</b>.</li><li>Watch the Processor PID change (Node processes) and the gate open on the next reading above 2.8 m.</li>
        <li>Press <b>Restore WAN Connection</b>: the outbox drains, Store and forward says <b>conserved</b>.</li></ol>`,
      init() {
        $("kWan").onclick = () => kill(true);
        $("kOnly").onclick = () => kill(false);
      }};
  }
  async function kill(cutWan) {
    const msg = $("faultMsg");
    try {
      if (cutWan) await fetch("/api/wan/cut", {method: "POST"});
      const r = await fetch("/api/fault/kill-processor", {method: "POST"});
      const b = await r.json();
      if (!r.ok) throw new Error(b.error || "HTTP " + r.status);
      msg.innerHTML = `<span style="color:var(--bad)">SIGKILL sent to Processor PID ${b.pid}${cutWan ? " and WAN cut" : ""} at ${fmtTime(b.ts)}.</span>`;
      flashMsg(`SIGKILL → Processor PID ${b.pid}${cutWan ? " + WAN cut" : ""}`, 3000);
    } catch (e) { msg.innerHTML = `<span style="color:var(--bad)">${esc(e.message)}</span>`; }
    poll();
  }
  return {
    title: "OS5-5 · Waterfront sluice gate", draw, frame, render, extra,
    offlineText: "the sluice gate is controlled by the edge node",
    act: {name: GATE, title: "Backup sluice gate", unit: "", fmt: v => v == null ? "-" : (v >= 1 ? "OPEN" : "CLOSED"),
          activeBadge: "command active", idleBadge: "closed"},
    decimals: {SLUICE_WATER_LEVEL_M: 2, MAINS_VOLT: 1},
    legend: `<span><i style="background:#5b9bd5"></i>lake water (height = latest level reading)</span>
      <span><i style="background:#d35400"></i>sluice gate (actuator state from the node)</span>
      <span><i style="background:#fff;border:2px dashed #c62828"></i>flood threshold of the rule</span>`,
    foot: "Live data from this node: water level and mains voltage, the gate state and its TTL, decisions, outbox and receiver counts, "
      + "and the Processor's PID and restart count. Drawn by the page: the cross-section, the water and gate motion. "
      + "The water levels are SIMULATED by the node's sensor generator (as in the repo's source registry).",
  };
})();

    let c = false;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const [xi, yi] = ring[i], [xj, yj] = ring[j];
      if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) c = !c;
    }
    return c;
  }
  function co2Color(v) {
    if (v == null) return "#d3d9e0";

  }
  function draw(ctx) {

      const kx = Math.cos(lat0 * Math.PI / 180) * 111320, ky = 110540;
      const xs = all.map(p => p[0] * kx), ys = all.map(p => p[1] * ky);
      const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
      const k = Math.min((BOX.w - 140) / (maxx - minx), (BOX.h - 220) / (maxy - miny));
      const ox = BOX.x + (BOX.w - (maxx - minx) * k) / 2, oy = BOX.y + 110;
      const P = p => [ox + (p[0] * kx - minx) * k, oy + (maxy - p[1] * ky) * k];
      // roads around the block (schematic)

      txt("road (schematic)", {x: BOX.x + 20, y: y1 + 51, "font-size": 9.5, fill: "#f4f6f8"});
      feats.forEach(f => {

        txt(`${(f.properties && f.properties.building_id) || ""} · ${has ? "this node" : "no sensor on this node"}`,

        M.blds.push({poly, has});
      });
      const [nx, ny] = P(node);
      el("circle", {cx: nx, cy: ny, r: 5, fill: "#14202e", stroke: "#fff", "stroke-width": 1.5});

        const p = f.properties || {};
        const here = inside === f;
        return `<div class="stop"><b>${esc(p.building_id || "?")}</b> ${esc(p.name || "")}
          <div class="small ${here ? "" : "mute"}">${here ? "contains this node's sensor (point-in-polygon)" : "no sensor on this node"}</div></div>`;
      }).join("")};
  }
  return {
    title: "OS1-5 · Songdo Convensia", draw, frame, render, extra,
    offlineText: "the building's ventilation runs on the edge node",
    act: {name: DAMPER, title: "HVAC damper", unit: "%", fmt: v => v == null ? "-" : Math.round(v),
          activeBadge: "command active", idleBadge: "baseline"},
    decimals: {INDOOR_CO2_PPM: 0, OCCUPANCY_PIR: 0},
    legend: `<span><i style="background:#7fc794"></i>CO₂ ≤ 800</span><span><i style="background:#f2c94c"></i>800–1000</span>
      <span><i style="background:#e57373"></i>&gt; 1000 ppm (rule fires)</span>
      <span><i style="background:#7b4fbf;border-radius:50%"></i>people (count = latest PIR reading)</span>`,
    foot: "Live data from this node: indoor CO₂ and PIR occupancy, the damper state and its TTL, decisions, outbox and receiver counts. "
      + "Drawn by the page: people moving in the room and the airflow. The footprints are the repo's SAMPLE GeoJSON (not real VWorld data); "
      + "the node's building is the footprint that contains its configured position.",
  };
})();

// ===================================================================== common panel
function spark(series, guide, guideLabel) {
  const w = 320, h = 46, p = 3;
  if (!series.length) return '<div class="small mute">no readings yet</div>';
  const vals = series.map(r => r.v);
  let lo = Math.min(...vals, guide ?? Infinity), hi = Math.max(...vals, guide ?? -Infinity);
  if (hi - lo < 1e-6) { hi += .5; lo -= .5; }
  const X = i => p + (i * (w - 2 * p)) / Math.max(1, series.length - 1);
  const Y = v => h - p - ((v - lo) * (h - 2 * p)) / (hi - lo);
  const pts = series.map((r, i) => `${X(i).toFixed(1)},${Y(r.v).toFixed(1)}`).join(" ");
  let g = "";
  if (guide != null) g = `<line x1="0" x2="${w}" y1="${Y(guide)}" y2="${Y(guide)}" stroke="#c62828" stroke-dasharray="4 3" stroke-width="1"/>`
    + `<text x="${w - 2}" y="${Y(guide) - 3}" font-size="9" fill="#c62828" text-anchor="end">${esc(guideLabel)}</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">${g}`
    + `<polyline points="${pts}" fill="none" stroke="#1d5fb4" stroke-width="1.6"/></svg>`;
}
// Dashed line on a sparkline: the scene's own (undefined = none given), else the threshold of a rule on that sensor.
function guideFor(name) {
  const g = SC.guide ? SC.guide(name) : undefined;
  if (g !== undefined) return g;
  const r = S.ctx.rules.find(x => x.sensor === name);
  return r ? [r.threshold, `rule ${r.op} ${r.threshold}`] : null;
}
function render(live) {
  const ctx = S.ctx;
  $("wan").className = "badge " + (live.wan_online ? "on" : "off");
  $("wan").textContent = live.wan_online ? "WAN online" : "WAN cut";
  $("recv").className = "badge " + (live.receiver_reachable ? "on" : "off");
  $("recv").textContent = live.receiver_reachable ? "receiver reachable" : "receiver unreachable";
  if (L.nodeLed) { L.nodeLed.setAttribute("fill", "#2ecc71"); L.wanLed.setAttribute("fill", live.wan_online ? "#2ecc71" : "#e74c3c"); }
  if (!live.wan_online) {
    L.banner.setAttribute("opacity", 1); L.bannerRect.setAttribute("fill", "#b3261e");
    L.bannerTxt.textContent = `WAN CUT: ${SC.offlineText} · ${live.outbox_pending} events waiting in the outbox`;
  } else if (live.outbox_pending > 20) {
    L.banner.setAttribute("opacity", 1); L.bannerRect.setAttribute("fill", "#1d5fb4");
    L.bannerTxt.textContent = `WAN back: draining the outbox · ${live.outbox_pending} events left`;
  } else L.banner.setAttribute("opacity", 0);

  // actuator card
  const rule = ruleFor(SC.act.name);
  const a = actuator(live, SC.act.name);
  $("actVal").textContent = SC.act.fmt(a.value);
  $("actBadge").className = "badge " + (a.active ? "warnb" : "on");
  $("actBadge").textContent = a.active ? SC.act.activeBadge : SC.act.idleBadge;
  const ttl = a.ttl_s || (rule && rule.ttl_s) || 1;
  $("ttlBar").style.width = a.active ? Math.max(0, Math.min(100, 100 * (a.remaining_s || 0) / ttl)) + "%" : "0";
  const dflt = ctx.defaults[SC.act.name];
  const unit = SC.act.unit ? " " + SC.act.unit : "";
  $("actTxt").innerHTML = a.active
    ? `Set by rule <span class="mono">${esc(a.rule)}</span> on the node: ${(a.remaining_s || 0).toFixed(ttl < 5 ? 1 : 0)} s of ${ttl} s TTL left (monotonic clock). Returns to ${esc(SC.act.fmt(dflt))}${esc(unit)} when it expires.`
    : `No command inside its TTL, so the default (${esc(SC.act.fmt(dflt))}${esc(unit)}) is shown. Rule: <span class="mono">${esc(rule ? rule.sensor : "?")} ${esc(rule ? rule.op + " " + rule.threshold : "")}</span> sets ${esc(rule ? SC.act.fmt(rule.command) : "?")}${esc(unit)} for ${esc(rule ? rule.ttl_s : "?")} s.`;

  // sensors
  $("sensors").innerHTML = ctx.streams.map(s => {
    const ser = live.readings[s.name] || [], v = last(ser);
    const dec = (SC.decimals && SC.decimals[s.name]) ?? 2;
    const g = guideFor(s.name);
    return `<div style="margin-bottom:.45rem"><div class="row"><span class="mono">${esc(s.name)}</span><span style="flex:1"></span>
      <b>${v == null ? "-" : v.toFixed(dec)}</b><span class="mute small">${esc(s.unit || "")}</span></div>${spark(ser, g ? g[0] : null, g ? g[1] : "")}</div>`;
  }).join("");

  // store and forward
  $("evN").textContent = live.events ?? "-";
  $("dlN").textContent = live.delivered ?? "-";
  $("obN").textContent = live.outbox_pending;
  $("linkTxt").innerHTML = live.wan_online ? '<span style="color:var(--ok)">→ WAN up →</span>' : '<span style="color:var(--bad)">✕ WAN cut ✕</span>';
  const cons = live.delivered != null && live.delivered <= live.events && live.events - live.outbox_pending <= live.delivered;
  $("consBadge").className = "badge " + (live.delivered == null ? "none" : cons ? "on" : "off");
  $("consBadge").textContent = live.delivered == null ? "receiver ?" : cons ? "conserved" : "check";

  // decisions
  const dc = live.decision_counts || {};
  $("decCounts").textContent = Object.keys(dc).length ? Object.entries(dc).map(([k, n]) => `${k.toLowerCase()} ${n}`).join(" · ") : "";
  $("dec").innerHTML = live.decisions.length ? live.decisions.map(d => {
    const cls = d.status === "DISPATCHED" ? "on" : d.status === "PENDING" ? "run" : "warnb";
    return `<tr><td class="mono">${fmtTime(d.created_at)}</td><td class="mono" title="${esc(d.rule)}">${esc(d.rule.length > 12 ? d.rule.slice(0, 11) + "…" : d.rule)}</td>
      <td>${esc(d.command_value)}</td><td><span class="badge ${cls}" title="${esc(d.reason || "")}">${esc(d.status)}</span></td></tr>`;
  }).join("") : '<tr><td colspan="4" class="mute">No decisions yet</td></tr>';

  // processes
  const procs = live.processes || [];
  $("procs").innerHTML = procs.length ? procs.map(p => `<tr class="${p.restarts ? "warnrow" : ""}"><td class="mono">${esc(p.name)}</td>
    <td class="mono">${esc(p.pid ?? "-")}</td><td>${esc(p.restarts ?? 0)}</td><td class="small">${esc(p.state ?? "-")}</td></tr>`).join("")
    : '<tr><td colspan="4" class="mute">HealthMon has not reported yet</td></tr>';

  SC.render(live);
}

function showErr(msg) { const e = $("err"); e.style.display = msg ? "flex" : "none"; e.textContent = msg || ""; }
async function poll() {
  try {
    const r = await fetch("/api/map", {cache: "no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    S.live = await r.json(); S.ok = true; showErr("");
    render(S.live);
  } catch (e) {
    S.ok = false;
    showErr("The edge node does not answer (" + e.message + "). Start it with: bash scripts/start_demo.sh " + (S.ctx ? S.ctx.node.id.replace(/^EDGE_NODE_(OS\d).*$/, "$1") : "OS3"));
  }
}
async function wan(action) {
  try { await fetch("/api/wan/" + action, {method: "POST"}); } catch (e) { /* poll shows the state */ }
  poll();
}
let lastFrame = performance.now();
function frame(now) {
  const dt = Math.min(.1, (now - lastFrame) / 1000); lastFrame = now;
  if (SC && S.ok) SC.frame(dt, now);
  requestAnimationFrame(frame);
}
async function init() {
  try {
    const r = await fetch("/api/map/context", {cache: "no-store"});
    S.ctx = await r.json();
  } catch (e) { showErr("Cannot load the map context: " + e.message); setTimeout(init, 2000); return; }
  $("node").textContent = S.ctx.node.id;
  SC = SCENES[S.ctx.scene];
  if (!SC) {
    showErr(`No map scene for ${S.ctx.node.id}. Scenes exist for OS1, OS2, OS3 and OS5: start one with bash scripts/start_demo.sh OS3 (or OS1 / OS2 / OS5) and open /map on its port.`);
    return;
  }
  $("title").textContent = "Live map · " + SC.title;
  document.title = "Songdo Edge - " + SC.title;
  $("actTitle").textContent = SC.act.title;
  $("actUnit").textContent = SC.act.unit;
  $("legend").innerHTML = SC.legend;
  $("foot").textContent = SC.foot;
  svg.innerHTML = "";
  SC.draw(S.ctx);
  drawBanner();
  const x = SC.extra && SC.extra(S.ctx);
  if (x) {
    const box = $(x.top ? "extraTop" : "extra");
    box.style.display = "block";
    box.innerHTML = `<h2>${esc(x.title)}</h2>` + x.html;
    if (x.init) x.init();
  }
  poll(); setInterval(poll, 1000);
  requestAnimationFrame(frame);
}
init();
</script>
</body></html>
