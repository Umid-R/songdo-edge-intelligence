# OS2: Robot Edge Controller (Songdo Central Park)
# Values marked ASSUMED are not given in the handbook: confirm or change them.
node:
  id: EDGE_NODE_OS2_ROBOT
  lat: 37.3925
  lon: 126.636

paths:
  db: data/os2.db
  backups: data/backups
  pidfile: data/run/os2_pids.json
  schema: sql/schema.sql
  static: src/ui/static
  socket: /tmp/songdo_os2.sock

network:
  api_host: 127.0.0.1
  api_port: 8002

ipc:
  queue_maxsize: 500

sensor:
  interval_s: 0.5
  streams:   # simulated values are ASSUMED
    - {name: LIDAR_PROXIMITY_M, unit: m, base: 3.0, noise: 0.4, spike_prob: 0.05, spike_value: 0.5}
    - {name: IMU_YAW_RATE, unit: deg_s, base: 0.0, noise: 2.0, spike_prob: 0.0, spike_value: 0.0}

rules:
  - {name: obstacle_estop, sensor: LIDAR_PROXIMITY_M, op: "<", threshold: 0.8, actuator: SAFETY_ESTOP_LATCH, command: 1, ttl_s: 0.5}

supervisor:
  max_restarts: 5
  window_s: 60
  restart_delay_s: 0.5

sync:
  batch_size: 50
  interval_s: 1.0

health:
  interval_s: 2.0
