# OS1: Smart Building Edge Gateway (Songdo Convensia)
# Values marked ASSUMED are not given in the handbook: confirm or change them.
node:
  id: EDGE_NODE_OS1_CONVENSIA
  lat: 37.3888
  lon: 126.6534

paths:
  db: data/os1.db
  backups: data/backups
  pidfile: data/run/os1_pids.json
  schema: sql/schema.sql
  static: src/ui/static
  socket: /tmp/songdo_os1.sock

network:
  api_host: 127.0.0.1
  api_port: 8001

ipc:
  queue_maxsize: 500

sensor:
  interval_s: 0.5
  streams:   # simulated values are ASSUMED
    - {name: INDOOR_CO2_PPM, unit: ppm, base: 650, noise: 60, spike_prob: 0.05, spike_value: 1200}
    - {name: OCCUPANCY_PIR, unit: count, base: 12, noise: 2, spike_prob: 0.0, spike_value: 12}

rules:
  - {name: co2_vent, sensor: INDOOR_CO2_PPM, op: ">", threshold: 1000, actuator: HVAC_DAMPER_PCT, command: 100, ttl_s: 15.0}

supervisor:
  max_restarts: 5
  window_s: 60
  restart_delay_s: 0.5

sync:
  batch_size: 50
  interval_s: 1.0

health:
  interval_s: 2.0
