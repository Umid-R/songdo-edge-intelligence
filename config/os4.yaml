# OS4: IoT Edge Gateway (Techno-Strip Tower)
# Values marked ASSUMED are not given in the handbook: confirm or change them.
node:
  id: EDGE_NODE_OS4_IOT_HUB
  lat: 37.3812
  lon: 126.662

paths:
  db: data/os4.db
  backups: data/backups
  pidfile: data/run/os4_pids.json
  schema: sql/schema.sql
  static: src/ui/static
  socket: /tmp/songdo_os4.sock

network:
  api_host: 127.0.0.1
  api_port: 8004

ipc:
  queue_maxsize: 500

sensor:
  interval_s: 0.5
  streams:   # simulated values are ASSUMED
    - {name: PM25_UG_M3, unit: ug_m3, base: 30, noise: 8, spike_prob: 0.05, spike_value: 80}
    - {name: NOISE_LEQ_DBA, unit: dBA, base: 55, noise: 4, spike_prob: 0.0, spike_value: 55}

rules:
  - {name: dust_mist, sensor: PM25_UG_M3, op: ">", threshold: 50, actuator: MIST_CANNON_RELAY, command: 1, ttl_s: 30.0}

supervisor:
  max_restarts: 5
  window_s: 60
  restart_delay_s: 0.5

sync:
  batch_size: 50
  interval_s: 1.0

health:
  interval_s: 2.0
