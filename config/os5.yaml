# OS5: Fault-Tolerant Smart-City Node (Waterfront Lake Sluice)
# Values marked ASSUMED are not given in the handbook: confirm or change them.
node:
  id: EDGE_NODE_OS5_RELIABLE
  lat: 37.398
  lon: 126.621

paths:
  db: data/os5.db
  backups: data/backups
  pidfile: data/run/os5_pids.json
  schema: sql/schema.sql
  static: src/ui/static
  socket: /tmp/songdo_os5.sock

network:
  api_host: 127.0.0.1
  api_port: 8005

ipc:
  queue_maxsize: 500

sensor:
  interval_s: 0.5
  streams:   # simulated values are ASSUMED
    - {name: SLUICE_WATER_LEVEL_M, unit: m, base: 2.0, noise: 0.2, spike_prob: 0.05, spike_value: 3.0}
    - {name: MAINS_VOLT, unit: V, base: 220, noise: 2, spike_prob: 0.0, spike_value: 220}

rules:
  - {name: flood_relief, sensor: SLUICE_WATER_LEVEL_M, op: ">", threshold: 2.8, actuator: BACKUP_SLUICE_GATE_OPEN, command: 1, ttl_s: 60.0}

supervisor:
  max_restarts: 5
  window_s: 60
  restart_delay_s: 0.5

sync:
  batch_size: 50
  interval_s: 1.0

health:
  interval_s: 2.0
