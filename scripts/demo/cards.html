<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { font-family: "DejaVu Sans", sans-serif; color: #fff;
  background: radial-gradient(ellipse at 20% 20%, #2f5ba3 0%, #16243a 55%, #0d1626 100%); }
.grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
  linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 48px 48px; animation: pan 12s linear infinite; }
@keyframes pan { to { background-position: 48px 48px; } }
.wrap { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 140px; }
.tag { font-size: 22px; letter-spacing: .28em; color: #9fb7e6; font-weight: 700; opacity: 0; animation: up .7s .1s forwards; }
h1 { font-family: "DejaVu Serif", serif; font-size: 82px; line-height: 1.05; margin: 18px 0 10px; opacity: 0; animation: up .8s .35s forwards; }
.sub { font-size: 30px; color: #c9d6ee; opacity: 0; animation: up .8s .7s forwards; }
.line { height: 4px; width: 0; background: linear-gradient(90deg, #6fa8ff, #1baf7a); margin: 30px 0; animation: grow 1s .9s forwards; border-radius: 2px; }
@keyframes grow { to { width: 420px; } }
@keyframes up { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
.pts { display: flex; gap: 22px; margin-top: 8px; }
.pt { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 14px; padding: 18px 24px; font-size: 22px;
  opacity: 0; animation: up .6s forwards; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; margin-top: 26px; }
.kpi { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 16px; padding: 24px 26px; opacity: 0; animation: up .6s forwards; }
.kpi b { display: block; font-family: "DejaVu Serif", serif; font-size: 50px; color: #8fd0ff; }
.kpi span { font-size: 19px; color: #c9d6ee; }
.num { font-family: "DejaVu Serif", serif; font-size: 150px; font-weight: 700; color: rgba(143,208,255,.9); line-height: 1; opacity: 0; animation: up .7s .15s forwards; }
.pulse { position: absolute; right: 140px; top: 50%; width: 260px; height: 260px; margin-top: -130px; border-radius: 50%;
  border: 3px solid rgba(143,208,255,.5); animation: ring 2.2s ease-out infinite; }
.pulse.b { animation-delay: 1.1s; }
@keyframes ring { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }
</style></head><body><div class="grid"></div><div class="pulse"></div><div class="pulse b"></div><div class="wrap" id="w"></div>
<script>
const q = new URLSearchParams(location.search).get("c") || "intro";
const W = document.getElementById("w");
const C = {
  intro: `<div class="tag">TEAM A · OPERATING SYSTEM · LIVE DEMO</div><h1>Songdo Edge Intelligence</h1>
    <div class="sub">Disconnect the Internet → the system keeps operating.</div><div class="line"></div>
    <div class="pts"><div class="pt" style="animation-delay:1.3s">① Run any task from one console</div>
    <div class="pt" style="animation-delay:1.6s">② Whole node through a WAN cut + crash</div>
    <div class="pt" style="animation-delay:1.9s">③ Cut, restore, reconcile — live</div></div>`,
  s1: `<div class="num">01</div><h1>Run any task<br>from one console</h1><div class="sub">25 handbook scenarios · one registry for the CLI and the UI</div>`,
  s2: `<div class="num">02</div><h1>The whole node:<br>WAN cut + SIGKILL</h1><div class="sub">Node and receiver are separate processes with separate databases</div>`,
  s3: `<div class="num">03</div><h1>Cut · restore ·<br>reconcile</h1><div class="sub">Live processes from /proc · ID sets on both sides of the receiver</div>`,
  outro: `<div class="tag">RESULTS ON LINUX</div><h1>Nothing lost. Nothing twice.</h1><div class="line"></div>
    <div class="kpis"><div class="kpi" style="animation-delay:.6s"><b data-n="25">0</b><span>/ 25 scenarios pass</span></div>
    <div class="kpi" style="animation-delay:.9s"><b data-n="119">0</b><span>/ 119 tests pass</span></div>
    <div class="kpi" style="animation-delay:1.2s"><b data-n="2674">0</b><span>events: G = C = A = R</span></div>
    <div class="kpi" style="animation-delay:1.5s"><b data-n="600">0</b><span>s WAN outage, 0 lost</span></div></div>
    <div class="sub" style="margin-top:34px;animation-delay:2.2s">Songdo Edge Intelligence · Team A</div>`,
};
W.innerHTML = C[q];
document.querySelectorAll("[data-n]").forEach(el => {
  const target = +el.dataset.n, t0 = performance.now() + 800, dur = 1600;
  const tick = now => { const p = Math.min(1, Math.max(0, (now - t0) / dur)); const e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(target * e).toLocaleString(); if (p < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
});
</script></body></html>
