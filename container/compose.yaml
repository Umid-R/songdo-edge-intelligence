# OCI compose file with CPU/RAM cgroup limits and a healthcheck. Run from the repo root:
#   docker compose -f container/compose.yaml up --build      # dashboard: http://127.0.0.1:8000
services:
  edge:
    build:
      context: ..
      dockerfile: container/Dockerfile
    ports:
      - "8000:8000"
    cpus: 1.0
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/status',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
